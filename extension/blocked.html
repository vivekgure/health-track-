<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spider Focus Shield Active | LifeSync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080808;
      color: #F5F5F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    .card {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 520px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(181, 18, 27, 0.25);
      position: relative;
      z-index: 10;
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: rgba(181, 18, 27, 0.2);
      border: 1px solid rgba(255, 38, 56, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 0 20px rgba(255, 38, 56, 0.35);
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 12px;
    }
    p {
      color: #999999;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      background: rgba(181, 18, 27, 0.2);
      color: #FF2638;
      border: 1px solid rgba(255, 38, 56, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .breathe-circle {
      width: 80px;
      height: 80px;
      background: rgba(181, 18, 27, 0.2);
      border: 2px solid #FF2638;
      border-radius: 50%;
      margin: 16px auto;
      box-shadow: 0 0 25px rgba(255, 38, 56, 0.4);
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .quote {
      font-style: italic;
      color: #CCCCCC;
      font-size: 13px;
      border-top: 1px solid #292929;
      padding-top: 16px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🕸️</div>
    <div class="badge">Spider Web Focus Shield Active</div>
    <h1>Take a Mindful Breath</h1>
    <p>This website is locked by your LifeSync Focus Shield to protect your flow state and safeguard your daily momentum.</p>
    <div class="breathe-circle"></div>
    <p style="font-size: 13px; color: #666666;">Breathe in... Breathe out...</p>
    <div class="quote">&ldquo;Focus is the art of knowing what to ignore.&rdquo;</div>
  </div>
</body>
</html>
