<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      background: #0B111E;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: #6366F1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #FFF;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
    }
    .card {
      background: #162238;
      border: 1px solid #2B4168;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn {
      width: 100%;
      background: #6366F1;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      margin-top: 8px;
    }
    .btn:hover { background: #4F46E5; }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      background: #10B981;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">LS</div>
    <div class="title">LifeSync Companion</div>
  </div>
  <div class="card">
    <div class="toggle-row">
      <span style="font-size: 14px; font-weight: 500;">Focus Shield</span>
      <span id="focusStatusBadge" style="font-size: 12px; color: #10B981;">ACTIVE</span>
    </div>
    <p style="font-size: 12px; color: #94A3B8; margin: 8px 0;">Blocks distracting sites during focus mode</p>
    <button id="toggleBtn" class="btn">Toggle Focus Shield</button>
  </div>
  <div class="card">
    <div style="font-size: 13px; font-weight: 500; margin-bottom: 6px;">
      <span class="status-dot"></span>Sync Status
    </div>
    <div style="font-size: 12px; color: #94A3B8;">Connected to local LifeSync dashboard</div>
  </div>
</body>
</html>
